<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palash Pathare — AI/ML Engineer & Systems Architect</title>
    <meta name="description" content="Cinematic portfolio of Palash Pathare. Neural architectures, low-carbon logistics, and high-performance web systems." />
    <meta name="theme-color" content="#E7E5DC" />

    <!--
      Rule 9: paint parchment before React boots — zero white flash.
      Background matches --bg-greige so even if JS is slow there is no colour pop.
    -->
    <style>
      html, body {
        background-color: #E7E5DC !important;
        margin: 0;
        padding: 0;
        /* Rule 2: no CSS smooth scroll */
      }
    </style>

    <!-- Fonts: preconnect first, then load with display=block so glyphs paint synchronously -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Unbounded Black/ExtraBold — extended grotesk for headlines
      JetBrains Mono — the mono label font
      Syne ExtraBold/Bold — fallback headline + role line
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500;700&display=block"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="cinematic-root"></div>
    <script type="module" src="/different story/main.tsx"></script>
  </body>
</html>
